name: Bug report
description: Report a reproducible product or parsing problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never attach confidential event material. Replace names and sensitive details before sharing a sample.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the smallest steps and, if possible, a shareable minimal fixture with private content removed.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
